[package]
name = "injector"
version.workspace = true
edition.workspace = true
default-run = "mio_launcher"

[[bin]]
name = "mcbe_injector"
path = "src/main.rs"

[[bin]]
name = "mcbe_injector_gui"
path = "src/bin/gui.rs"

[[bin]]
name = "mio_launcher"
path = "src/bin/mio_launcher.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts", "accesskit"] }
rfd = "0.18.0"
sigscan = { path = "../sigscan" }

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
