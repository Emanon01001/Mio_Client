# Memory-layout offsets used by coordinates and esp. Most offsets are read from
# the running game's code and need no entry. The ones below cannot be, so they
# default to the values for 1.26.6301.0; after a game update that moves them,
# uncomment and correct the affected lines (see analysis/notes/esp.md for how each
# was found). A wrong value disables the feature rather than crashing.
[offsets]
# actor_registry  = 0x10    # Actor -> entity registry
# registry_pools  = 0x68    # registry -> component pool list
# pool_entities   = 0x20    # pool -> entity ids
# pool_pages      = 0x50    # pool -> component pages
# pool_page_len   = 128     # components per page
# view_matrix     = 0x438   # ClientInstance -> camera basis vectors
# level_renderer  = 0x1E0   # ClientInstance -> LevelRenderer
# renderer_player = 0x480   # LevelRenderer -> LevelRendererPlayer
# camera_origin   = 0x64C   # LevelRendererPlayer -> camera position
# projection_x    = 0xF50   # LevelRendererPlayer -> projection m00
# projection_y    = 0xF64   # LevelRendererPlayer -> projection m11

# Byte patches located by signature in Minecraft.Windows.exe. Toggling writes
# `bytes` at (match + offset); toggling off restores the original bytes.
# Signatures are version specific - verify them (must be a unique match) with:
#   mcbe_injector scan "48 8B 05 ?? ?? ?? ?? F3 0F 10"
#
# [[patch]]
# name = "example"
# key = "F9"
# enabled = false
# signature = "48 8B 05 ?? ?? ?? ?? F3 0F 10"
# offset = 0
# bytes = "90 90 90"
