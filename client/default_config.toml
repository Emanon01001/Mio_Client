# Mio Client config (Mio_Client.toml next to Mio_Client.dll).
#
# Key names: F1-F24, A-Z, 0-9, END, HOME, INSERT, DELETE, PAGEUP, PAGEDOWN,
# TAB, SPACE, LSHIFT, LCONTROL, LALT, MOUSE4, MOUSE5, hex VK code (0x23), NONE.

[general]
eject_key = "END"
# Only perform automatic actions while in the world view (no screen open).
require_hidden_cursor = true

# Grounded edge assistance via normal sneak; manual jumping takes priority.
[safewalk]
key = "NONE"
enabled = false
margin = 0.12

# Same tool family below the remaining durability threshold. Hotbar, then inventory.
[durabilityguard]
key = "NONE"
enabled = false
reserve = 10
empty_slot = false

# Read-only warning for worn tools/armor; threshold is remaining durability percent.
[durabilityalert]
key = "NONE"
enabled = false
threshold = 10.0
hotbar = true
armor = true
cooldown = 5.0

# Manually cast first. Uses your bobber's catchable-window event and native use.
[autofish]
key = "NONE"
enabled = false
recast = true
delay = 0.8
reserve = 5
clear_view = false

# In-game overlay. While the menu is open, input is kept away from the game.
[gui]
enabled = true
menu_key = "L"
# Always-on list of enabled modules in the top-left corner.
show_hud = true
# Position of the grouped module/readout list; negative values anchor to right/bottom.
hud_x = 10
hud_y = 10
# Compact list: smaller rows, margins and width.
hud_compact = true
# Leave out features that are only waiting ("未接続", "データ待ち", "待機中").
hud_hide_idle = true
# Columns of the list: 0 = automatic (split into up to 3 columns when the list
# would be taller than 45% of the screen), 1-3 = fixed.
hud_columns = 0
# Keep the full list visible vertically; fit text/spacing to the screen height.
hud_vertical = true
hud_width = 360
# auto = DX12 if d3d12.dll is loaded, otherwise DX11. Force "dx11"/"dx12" if
# the overlay does not appear.
renderer = "auto"
# The console (log + commands) is part of the overlay menu. Set this to also
# open a separate console window; one opens anyway if the overlay cannot start.
console_window = false
# Brief notices at the right edge when a feature is switched on or off, a
# highlighted chat message arrives, etc.
notifications = true
# 日本語・英数字を同じWindows日本語フォントで表示します。サイズは12～28px。
# 変更は次回注入時に反映されます。
font_size = 16.0

# Movement while an inventory screen is open. Chat, pause screens and the overlay stop it.
# Match these keys to Minecraft's movement bindings. No synthetic key events.
[inventorymove]
key = "NONE"
enabled = true
jump = true
sneak = false
automatic = true
forward_key = "W"
backward_key = "S"
left_key = "A"
right_key = "D"
jump_key = "SPACE"
sneak_key = "LSHIFT"

# Requests sprint using the game's movement state. No simulated keys.
# Requires Minecraft 1.26.6301.0 / 1.26.65.1 x64. Uses the game's movement bindings.
[auto_sprint]
key = "F6"
enabled = false
# Request normal jump only while grounded and moving forward; release in midair.
jump = true

# Continuous vanilla forward input. Manual backward input temporarily pauses it.
# Combine with autosprint for automatic sprinting and grounded jumping.
[auto_walk]
key = "NONE"
enabled = false
pause_back = true

# Continuous vanilla sneak input, optionally only during forward movement.
[auto_sneak]
key = "NONE"
enabled = false
forward_only = false

# Grounded jumping without requiring sprint. Sneak input always pauses it.
[auto_jump]
key = "NONE"
enabled = false
forward_only = true

# Normal jump/swim-up input while the player's head is underwater.
# Sneak input pauses floating so the player can deliberately dive.
[auto_swim]
key = "NONE"
enabled = false
forward_only = false

# Repeats native attack while the game's attack button is held (normally LMB).
# Requires Minecraft 1.26.6301.0 / 1.26.65.1 x64. CPS is limited by native input update rate.
[auto_clicker]
key = "F7"
enabled = false
cps = 12.0

# Attacks the nearest loaded living actor using GameMode::attack. No key events.
# Only in focused gameplay; pauses in chat, inventories and the overlay menu.
# When enabled, takes priority over the autoclicker's repeated attacks.
[killaura]
key = "NONE"
enabled = false
range = 3.0
cps = 8.0
# Maximum distinct targets per attack cycle (1 restores single-target mode).
max_targets = 8
players = true
mobs = true
fov = 360.0
line_of_sight = false
hold_only = false

# Attacks only the nearest entity intersecting the crosshair; blocks stop it.
# Aura takes priority, then TriggerBot, then repeated AutoClicker attacks.
[triggerbot]
key = "NONE"
enabled = false
range = 3.0
cps = 8.0
players = false
mobs = true

# Scales the game's clock (QueryPerformanceCounter). 1.0 = normal speed.
[timer]
key = "F8"
enabled = false
speed = 1.5

# Shows the player's block position (X Y Z) in the overlay's HUD list.
# native_hud = true additionally forces Minecraft's own coordinate display on,
# regardless of the world's showCoordinates setting (the world is not changed).
# Supported executables: 1.26.6301.0 / 1.26.65.1 x64 only.
# nether = true also shows the matching X Z in the Nether (X/8, Z/8), or in
# the Overworld while in the Nether.
[coordinates]
key = "F9"
enabled = true
native_hud = false
nether = false

# Outlines every entity's bounding box in the overlay, through walls.
# show_small also outlines dropped items, arrows and orbs; tracers draws a
# line from the bottom of the screen to each entity, for the kinds switched on
# below (players, hostile, neutral, passive mobs, and other entities).
# max_distance is in blocks (0 = no limit). Needs the overlay ([gui] enabled).
# Supported executables: 1.26.6301.0 / 1.26.65.1 x64 only.
[esp]
key = "F10"
enabled = false
show_small = false
tracers = false
tracer_players = true
tracer_hostile = true
tracer_neutral = true
tracer_passive = true
tracer_other = false
max_distance = 0
players = true
passive = true
hostile = true
other = true
player_color = [64, 200, 255]
passive_color = [80, 230, 100]
hostile_color = [255, 64, 64]
other_color = [200, 200, 200]

[armorhud]
key = "NONE"
enabled = false
x = 20
y = 240
percent = true

[inventoryhud]
key = "NONE"
enabled = false
x = -20
y = 520
hotbar_only = false
max_rows = 12
grid = true
slot_size = 40
show_counts = true
show_durability = true

[sessionstats]
key = "NONE"
enabled = false
x = 20
y = 150
reset_key = "NONE"

[deathpoint]
key = "NONE"
enabled = false
keep = 5

# Vanilla tool families; base material speed, no enchantment comparison.
[autotool]
key = "NONE"
enabled = false
min_durability = 5
restore = true

# Ordinary food in hotbar; starts looking into air, away from nearby entities.
[autoeat]
key = "NONE"
enabled = false
hunger = 16
restore = true

# While on, W/A/S/D move along the view direction, Space rises, Shift sinks,
# and the player hovers otherwise. speed is in blocks per second.
[fly]
key = "F4"
enabled = false
speed = 10.0

# While enabled, holding hold_key zooms in by `factor` (1.5-30). The held item
# keeps its normal size. Supported executables: 1.26.6301.0 / 1.26.65.1 x64.
[zoom]
enabled = false
hold_key = "C"
factor = 4.0
# Optional mouse-option scaling while holding zoom; touch/controller unchanged.
# Experimental: this multiplier is not an exact angular turn-rate ratio.
sensitivity = false
sensitivity_scale = 0.25
# Milliseconds a zoom in or out takes (0 = instant).
smooth_ms = 200.0

# Draws the world with a fixed field of view of `degrees` (30-170), beyond the
# game's own slider. Sprint/speed FOV changes are replaced while it is on; zoom
# still applies on top. The saved setting is not changed. 1.26.6301.0 / 1.26.65.1 x64.
[fov]
key = "NONE"
enabled = false
degrees = 110.0

# Reports a high gamma (1-25; the game's own setting is 0-1) to the renderer,
# so dark areas are drawn bright. The saved brightness setting is not changed.
# Works with the Simple and Fancy graphics modes; Vibrant Visuals ignores it.
# Supported executables: 1.26.6301.0 / 1.26.65.1 x64.
[fullbright]
key = "NONE"
enabled = false
gamma = 10.0

# --- HUD readouts ---------------------------------------------------------
# Each adds one line to the HUD list while enabled. They only display values.

# Frames per second of the overlay (the game's render rate).
[fps]
key = "NONE"
enabled = false

# Physical left | right mouse clicks in the last second.
[cps]
key = "NONE"
enabled = false

# Horizontal speed in blocks per second.
[speed]
key = "NONE"
enabled = false

# Compass direction, yaw and pitch of the view.
[direction]
key = "NONE"
enabled = false

# Compass ribbon at the top center. Minecraft yaw: 0=S, 90=W, 180=N, 270=E.
[compass]
key = "NONE"
enabled = true
width = 400.0
y = 10
# Horizontal offset from the centered position.
x = 0

# The dimension the player is in. Supported builds: 1.26.6301.0 / 1.26.65.1 x64.
[dimension]
key = "NONE"
enabled = false

# The computer's local time.
[clock]
key = "NONE"
enabled = false

# Counts up from the moment it is switched on.
[stopwatch]
key = "NONE"
enabled = false

# Memory used by the game process.
[memory]
key = "NONE"
enabled = false

# Number of loaded entities other than the player.
[entities]
key = "NONE"
enabled = false

# Address of the connected server (same as the `ip` command).
[server]
key = "NONE"
enabled = false

# Round trip to the connected server: observed read-only on the game's own
# traffic (RakNet connected ping/pong and ACKs, NetherNet's STUN connectivity
# checks); a separate server-list ping fills
# in until then or for connections it cannot read. Nothing is fabricated.
[ping]
key = "NONE"
enabled = false
interval_ms = 2000
x = 10
y = -170

