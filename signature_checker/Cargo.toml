[package]
name = "signature-checker"
version.workspace = true
edition.workspace = true
default-run = "mio_signature_checker"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[lib]
name = "mio_signature_check"

[[bin]]
name = "mio_signature_checker"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "mio_signature_checker_cli"
path = "src/bin/cli.rs"

[dependencies]
sigscan = { path = "../sigscan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts", "accesskit"], optional = true }
rfd = { version = "0.18.0", optional = true }
